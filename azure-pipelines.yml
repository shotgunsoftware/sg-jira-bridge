resources:
  repositories:
    - repository: templates
      type: github
      name: shotgunsoftware/tk-ci-tools
      # Testing the tk-ci-tools branch, revert to master before merging.
      ref: refs/heads/ticket/SG-47353-test-matrix-latest-images
      endpoint: shotgunsoftware
      # Despite using the "tk-" prefix, tk-ci-tools is not a Toolkit only tool.
      # We use it to avoid duplicating and maintaining CI pipeline code.

trigger:
  branches:
    include:
    - master
  tags:
    include:
    - v*
pr:
  branches:
    include:
    - "*"

jobs:
- template: build-pipeline.yml@templates
  parameters:
    has_ui_resources: false

    extra_test_dependencies:
    - -r requirements.txt
    - -r tests/requirements.txt

    # Jira Bridge does not follow the exact same Python version lifecycle than
    # Toolkit, so it lists its own Python versions. Each one runs on Linux,
    # macOS and Windows with their -latest image, unless os_versions says
    # otherwise.
    run_tests_extra_parameters:
      platform_versions:
      - name: Python 3.9
        python_version: '3.9'
        qt_wrapper: PySide2==5.15.2.1
        os_versions:
          # ubuntu-latest (Ubuntu 26.04) does not provide Python 3.9
          Linux: ubuntu-24.04
      - name: Python 3.10
        python_version: '3.10'
        qt_wrapper: PySide2==5.15.2.1
      - name: Python 3.11
        python_version: '3.11'
        qt_wrapper: PySide6~=6.6.3
      - name: Python 3.13
        python_version: '3.13'
        qt_wrapper: PySide6~=6.8.3
